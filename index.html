<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="一念人间">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eef6ea">
<title>修仙还是游戏人间</title>
<style>
/* ============================================================
   修仙还是游戏人间
   清新绿意：嫩叶底 + 竹青 + 苔色
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{color-scheme:light;height:100%;-webkit-text-size-adjust:100%;}
body{font-family:"KaiTi","STKaiti","Songti SC","PingFang SC","Microsoft YaHei",serif;
  color:#2c3a30;background:#eff7ea;line-height:1.75;font-size:16px;
  height:100%;overflow:hidden;transition:background .8s;}
body.s-spring{background:#eff8ea;}
body.s-summer{background:#e8f4e8;}
body.s-autumn{background:#f2f3e6;}
body.s-winter{background:#ecf1ee;}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
#fx span{position:absolute;top:-8vh;will-change:transform;}
@keyframes sway{
  0%{transform:translate(0,-10vh) rotate(0deg);}
  25%{transform:translate(34px,26vh) rotate(70deg);}
  50%{transform:translate(-26px,52vh) rotate(150deg);}
  75%{transform:translate(40px,78vh) rotate(240deg);}
  100%{transform:translate(-14px,112vh) rotate(340deg);}
}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;
  padding:8px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  gap:8px;overflow:hidden;}
.topbar{background:rgba(252,255,250,.92);border:1px solid #cfe2c9;border-radius:14px;
  padding:9px 15px;display:flex;flex-wrap:wrap;gap:8px;
  align-items:center;justify-content:space-between;
  box-shadow:0 2px 12px rgba(79,138,91,.10);flex-shrink:0;}
.topbar h1{font-size:19px;font-weight:normal;letter-spacing:3px;color:#3f7a52;}
.topbar h1 small{font-size:13px;color:#88a08c;letter-spacing:1px;margin-left:6px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.cgroup{display:flex;flex-wrap:wrap;gap:6px;}
.chip{background:#eef7ea;border:1px solid #cfe2c9;border-radius:20px;
  padding:4px 12px;font-size:13.5px;color:#4d6153;white-space:nowrap;line-height:1.7;}
.chip b{color:#3f7a52;font-weight:normal;font-size:15px;}
.chip.money{background:#f7f5e6;border-color:#e0dcb8;color:#8a7c3a;}
.chip.egg{background:#f8edf4;border-color:#e2c3d8;color:#9b5a86;}
.main{flex:1;min-height:0;display:flex;gap:8px;overflow:hidden;}
.side{flex:0 0 264px;min-height:0;display:flex;overflow:hidden;}
.content{flex:1;min-height:0;display:flex;overflow:hidden;}
.panel{background:rgba(252,255,250,.94);border:1px solid #cfe2c9;border-radius:14px;
  padding:12px 14px;box-shadow:0 2px 10px rgba(79,138,91,.07);
  display:flex;flex-direction:column;min-height:0;}
.panel h3{font-size:15px;font-weight:normal;letter-spacing:3px;color:#3f7a52;
  border-bottom:1px dashed #cfe2c9;padding-bottom:6px;margin-bottom:9px;
  flex-shrink:0;display:flex;justify-content:space-between;align-items:center;}
.panel h3 em{font-style:normal;font-size:13px;color:#88a08c;letter-spacing:0;}
.log-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;font-size:14.5px;
  line-height:1.8;color:#4d6153;overscroll-behavior:contain;}
.log-body p{padding:5px 0;border-bottom:1px dotted #e3efe0;word-break:break-word;}
.log-body p:last-child{border-bottom:none;}
.log-body .dt{color:#88a08c;font-size:13px;margin-right:6px;}
.log-body .gd{color:#4f8a5b;}
.log-body .bd{color:#b35446;}
.log-body .gd2{color:#3f7a52;}
.log-body .pink{color:#b36a8c;}
.log-body .gold{color:#a08a3e;}
.page-title{font-size:18px;letter-spacing:3px;color:#3f7a52;margin-bottom:3px;}
.page-sub{font-size:14px;color:#88a08c;margin-bottom:11px;letter-spacing:.5px;}
.hint{font-size:13.5px;color:#a58b3e;background:#faf7e8;border:1px dashed #e2d8ae;
  border-radius:9px;padding:6px 10px;margin:-4px 0 10px;letter-spacing:.5px;}
.hint.secret{color:#9b5a86;background:#faf0f6;border-color:#e2c3d8;}
.acts{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
  gap:8px;align-content:start;overscroll-behavior:contain;
  padding-bottom:92px;scroll-padding-bottom:92px;}
.act{display:flex;gap:8px;align-items:flex-start;
  background:#fdfffb;border:1px solid #cfe2c9;border-radius:12px;
  padding:11px 13px 13px;text-align:left;cursor:pointer;font-family:inherit;
  font-size:15.5px;color:#2c3a30;transition:all .15s;-webkit-appearance:none;
  min-height:76px;width:100%;align-self:start;}
.act:hover{border-color:#a7c9a9;background:#f3faf0;}
.act:active{transform:scale(.98);}
.act.off{opacity:.42;pointer-events:none;}
.act .ic{font-size:22px;line-height:1.15;flex-shrink:0;}
.act .bd{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;}
.act .t1{font-size:15.5px;letter-spacing:.5px;}
.act .t2{font-size:13.5px;color:#88a08c;line-height:1.5;}
.act .t3{font-size:13px;color:#6f9a76;margin-top:2px;}
.money{font-size:14px;color:#3f7a52;margin-bottom:8px;}
.money b{font-size:21px;font-weight:normal;color:#2f6644;}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.tags span{background:#eef7ea;border:1px solid #cfe2c9;border-radius:10px;
  padding:3px 10px;font-size:13px;color:#4d6153;}
.stat-row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:#4d6153;}
.stat-row b{font-weight:normal;color:#3f7a52;font-size:14.5px;}
.bar{height:6px;background:#e6f1e2;border-radius:4px;overflow:hidden;margin:1px 0 6px;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#9ecfa4,#4f8a5b);border-radius:4px;}
.footbar{background:rgba(252,255,250,.92);border:1px solid #cfe2c9;border-radius:14px;
  padding:7px 12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;
  align-items:center;flex-shrink:0;box-shadow:0 2px 10px rgba(79,138,91,.08);}
.nav{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 520px;}
.nav button,.timebox button{min-height:46px;font-family:inherit;font-size:14.5px;
  letter-spacing:.5px;border-radius:10px;cursor:pointer;
  border:1px solid #cfe2c9;background:#f5fbf2;color:#4d6153;
  padding:8px 12px;-webkit-appearance:none;transition:all .15s;}
.nav button:hover{background:#e9f5e5;}
.nav button.on{background:#4f8a5b;color:#fff;border-color:#4f8a5b;}
.timebox{display:flex;gap:8px;flex-wrap:wrap;}
.timebox button.primary{background:linear-gradient(135deg,#7fb887,#4f8a5b);color:#fff;border-color:transparent;}
.timebox button:disabled{opacity:.4;}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(38,52,40,.45);
  display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;}
.overlay.show{display:flex;}
.modal{background:#fdfffc;border:1px solid #c6dcc0;border-radius:16px;max-width:620px;width:100%;
  padding:20px 22px;box-shadow:0 16px 50px rgba(40,60,45,.3);position:relative;}
.modal-x{position:absolute;right:10px;top:10px;width:32px;height:32px;border:none;border-radius:50%;
  background:#eef6ea;color:#5b7a60;font-size:16px;line-height:1;cursor:pointer;font-family:inherit;}
.modal-x:hover{background:#e0efe0;}
.modal-title{font-size:17px;letter-spacing:3px;color:#3f7a52;margin-bottom:12px;padding-right:36px;
  border-bottom:1px dashed #cfe2c9;padding-bottom:9px;}
.modal-body{font-size:15px;color:#3b4b40;line-height:1.95;max-height:62vh;overflow-y:auto;}
.modal-body p{margin-bottom:8px;}
.buy{font-family:inherit;font-size:15px;min-height:48px;border-radius:10px;
  border:1px solid #c6dcc0;background:#f2f9ef;color:#3b4b40;cursor:pointer;
  padding:9px 14px;margin-top:10px;-webkit-appearance:none;transition:all .15s;}
.buy:hover{background:#e9f5e5;}
.buy.primary{background:linear-gradient(135deg,#7fb887,#4f8a5b);color:#fff;border-color:transparent;}
.qty-input{width:100%;display:block;font-family:inherit;font-size:19px;padding:11px 12px;
  border:1px solid #c6dcc0;border-radius:10px;background:#fff;color:#2c3a30;margin-top:8px;
  text-align:center;}
.pair-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.pair-row .buy{flex:1 1 160px;margin-top:0;}
.tiny{font-size:13px;color:#88a08c;}
.hl{color:#3f7a52;}
.em{color:#b35446;}
.secret{color:#9b5a86;}
.boot{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  padding:26px;background:transparent;}
/* 开局：竹叶飘落。竹叶为细长披针形，两头尖、中间略宽，叶脉平行 */
.bootleaves{position:fixed;inset:0;z-index:29;pointer-events:none;overflow:hidden;
  transition:opacity .8s;}
.bootleaves.bootbg{background:radial-gradient(circle at 50% 20%,#f6fdf1,#e4f2dd 70%);}
.bootleaves.ingame{z-index:35;opacity:.24;}
.bootleaves span{position:absolute;top:-70px;display:block;
  border-radius:0 100% 0 100%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
  will-change:transform;}
.bootleaves span:after{content:'';position:absolute;left:16%;top:14%;
  width:1px;height:70%;background:rgba(88,126,88,.28);
  transform:rotate(45deg);transform-origin:0 0;}
@keyframes leafFall{
  0%{transform:translate3d(0,-8vh,0) rotate(0deg);}
  20%{transform:translate3d(26px,20vh,0) rotate(110deg);}
  40%{transform:translate3d(-22px,42vh,0) rotate(215deg);}
  60%{transform:translate3d(30px,64vh,0) rotate(330deg);}
  80%{transform:translate3d(-26px,88vh,0) rotate(455deg);}
  100%{transform:translate3d(12px,114vh,0) rotate(580deg);}
}
.boot-card{max-width:560px;width:100%;text-align:center;background:rgba(253,255,252,.95);
  border:1px solid #cfe2c9;border-radius:20px;padding:40px 34px;
  box-shadow:0 18px 60px rgba(60,110,70,.18);}
.boot-card .logo{font-size:40px;letter-spacing:6px;color:#3f7a52;margin-bottom:8px;line-height:1.4;}
.boot-card .sub{font-size:14px;color:#88a08c;letter-spacing:5px;margin-bottom:26px;}
.boot-card .desc{font-size:15px;color:#3b4b40;line-height:2;margin-bottom:28px;}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.btn-row button{min-width:168px;min-height:54px;font-family:inherit;font-size:16px;
  letter-spacing:2px;border-radius:12px;cursor:pointer;-webkit-appearance:none;}
.btn-primary{background:linear-gradient(135deg,#7fb887,#4f8a5b);color:#fff;border:1px solid transparent;}
.btn-ghost{background:#f2f9ef;color:#3b4b40;border:1px solid #c6dcc0;}
.story-panel{background:#fdfffc;border:1px solid #cfe2c9;border-radius:12px;padding:14px 16px;}
.story-title{font-size:17px;letter-spacing:5px;color:#3f7a52;text-align:center;margin-bottom:12px;}
.story-text{font-size:15px;line-height:2;}
/* 悬浮属性小球 */
.orb{position:fixed;right:16px;bottom:18px;z-index:38;width:54px;height:54px;border-radius:50%;
  border:1px solid #a7c9a9;background:radial-gradient(circle at 35% 30%,#eef9e9,#bfe0bf);
  color:#2f6644;font-family:inherit;font-size:17px;letter-spacing:1px;cursor:pointer;
  box-shadow:0 6px 18px rgba(60,110,70,.28);display:none;align-items:center;justify-content:center;
  -webkit-appearance:none;animation:orbFloat 3.6s ease-in-out infinite;}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.orb:active{transform:scale(.94);}
.orb-list{font-size:14px;color:#4d6153;line-height:1.85;}
.orb-scroll{max-height:46vh;overflow-y:auto;padding-right:2px;}
.orb-list b{font-weight:normal;color:#3f7a52;}
/* ===== 手机竖屏：整页滚动、分区排列 ===== */
@media (max-width:820px){
  html,body{height:auto;}
  body{overflow-y:auto;overflow-x:hidden;}
  .wrap{height:auto;min-height:100dvh;overflow:visible;padding:6px;gap:6px;}

  /* 标题单独置顶，略大加深 */
  .topbar{flex-direction:column;align-items:stretch;gap:6px;padding:8px 10px;border-radius:12px;}
  .topbar h1{font-size:19px;letter-spacing:2px;color:#2f6644;}
  .topbar h1 small{display:none;}
  /* 岁/性别/日期 一行，其余数值另起一行并自动换行（不横滑） */
  .chips{flex-direction:column;gap:5px;}
  .cgroup{gap:5px;}
  .chip{padding:3px 9px;font-size:12.5px;line-height:1.6;}
  .chip b{font-size:13.5px;}

  /* 面板纵向顺排，不再互相挤压 */
  .main{flex:none;flex-direction:column;gap:6px;overflow:visible;}
  .side{flex:none;max-height:none;overflow:visible;}
  .side>.panel{width:100%;}
  .content{flex:none;min-height:0;overflow:visible;}
  .main>.content:last-child{flex:0 0 auto !important;min-height:0;}
  .panel{padding:10px 11px;border-radius:12px;min-height:0;}
  .panel h3{font-size:14px;margin-bottom:6px;padding-bottom:5px;}
  .page-title{font-size:17px;}
  .page-sub{font-size:13px;margin-bottom:8px;}
  .hint{font-size:12.5px;padding:5px 9px;margin-bottom:8px;}

  /* 场所选项：单列竖排，随页面滚 */
  .acts{grid-template-columns:1fr;gap:7px;flex:none;overflow:visible;}
  .act{min-height:64px;padding:9px 11px 10px;}
  .act .ic{font-size:20px;}

  /* 浮生记要：五六行之后才滚动 */
  .log-body{flex:none;max-height:180px;overflow-y:auto;font-size:13.5px;line-height:1.75;}

  /* 底部导航常驻：两行各自横滑，不撑宽页面 */
  .footbar{position:sticky;bottom:0;z-index:20;flex-direction:column;align-items:stretch;
    padding:6px 9px;gap:6px;border-radius:12px;
    background:rgba(252,255,250,.97);box-shadow:0 -4px 14px rgba(79,138,91,.10);}
  .nav{flex:none;width:100%;min-width:0;flex-wrap:nowrap;overflow-x:auto;gap:5px;}
  .timebox{flex:none;width:100%;min-width:0;flex-wrap:nowrap;overflow-x:auto;gap:5px;}
  .nav::-webkit-scrollbar,.timebox::-webkit-scrollbar{display:none;}
  .nav button,.timebox button{min-height:38px;font-size:12.5px;padding:6px 10px;border-radius:9px;flex:0 0 auto;}

  /* 开局取名弹窗：加高，让「开始此生」不用滑 */
  .overlay{padding:14px 10px;}
  .modal{padding:14px 15px;border-radius:14px;max-width:520px;}
  .modal-title{font-size:15px;margin-bottom:8px;padding-bottom:6px;}
  .modal-body{font-size:14px;max-height:66vh;}
  .modal-body p{margin-bottom:6px;}
  .qty-input{font-size:16px;padding:8px 10px;margin-top:6px;}
  .buy{min-height:44px;font-size:14.5px;margin-top:8px;padding:8px 12px;}
  .tiny{font-size:12px;}

  .boot{padding:16px;overflow-y:auto;}
  .boot-card{padding:26px 18px;border-radius:16px;}
  .boot-card .logo{font-size:28px;letter-spacing:2px;}
  .boot-card .sub{font-size:12px;letter-spacing:3px;margin-bottom:18px;}
  .boot-card .desc{font-size:14px;margin-bottom:20px;}
  .btn-row{gap:9px;}
  .btn-row button{min-width:0;flex:1 1 42%;min-height:48px;font-size:15px;letter-spacing:1px;}
  .story-text{font-size:14.5px;line-height:1.9;}
  .orb{right:12px;bottom:104px;width:50px;height:50px;font-size:16px;}
}
</style>
<meta name="theme-color" content="#101014">
</head>
<body>
<div id="fx"></div>
<div class="bootleaves" id="bootleaves"></div>

<div class="boot" id="boot"></div>
<button class="orb" id="orb" onclick="openOrb()">属</button>

<div class="wrap" id="wrap" style="display:none">
  <div class="topbar">
    <h1>修仙还是游戏人间<small>一念入世 · 一念出世</small></h1>
    <div class="chips" id="topchips"></div>
  </div>
  <div class="main">
    <div class="side"><div class="panel"><h3>一生 <em id="modeTag"></em></h3><div id="sideBody" style="overflow-y:auto"></div></div></div>
    <div class="content"><div class="panel"><div id="pageHead"></div><div class="acts" id="acts"></div></div></div>
    <div class="content" style="flex:0 0 36%;"><div class="panel"><h3>浮生记要</h3><div class="log-body" id="logBody"></div></div></div>
  </div>
  <div class="footbar">
    <div class="nav" id="nav"></div>
    <div class="timebox">
      <button onclick="advanceDay()">⏳ 过一天</button>
      <button onclick="advanceMonth()">⇧ 过一月</button>
      <button class="primary" onclick="advanceYear()">⏩ 快进一年</button>
      <button onclick="save()">💾 存档</button>
      <button onclick="exportSave()">📤 导出</button>
      <button onclick="askRestart()">🔄 重开</button>
      <button onclick="openEndingAsk()">🌙 结束此生</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal">
  <button class="modal-x" onclick="closeModal()" aria-label="关闭">✕</button>
  <div class="modal-title" id="modalTitle"></div>
  <div class="modal-body" id="modalBody"></div>
</div></div>

<script>
/* ================= 工具 ================= */
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pk(a){return a[Math.floor(Math.random()*a.length)];}
function cl(v,a,b){return Math.max(a,Math.min(b,v));}
function num(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
var MN=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
var SEASON={1:'winter',2:'winter',3:'spring',4:'spring',5:'spring',6:'summer',7:'summer',8:'summer',9:'autumn',10:'autumn',11:'autumn',12:'winter'};

/* ================= 人物 ================= */
var NPCS={
  shen:{name:'沈疏放',g:'m',tag:'自称江南商贾，眉宇却有天子气',place:'cha',ic:'👁',pers:'霸道'},
  xiao:{name:'萧七',g:'m',tag:'背一柄旧剑的独行游侠',place:'wu',ic:'⚔',pers:'疯子'},
  xuan:{name:'玄真',g:'m',tag:'观澜道观里辨不清年岁的道人',place:'guan',ic:'☯',pers:'文雅'},
  wanyue:{name:'苏挽月',g:'f',tag:'风雅楼的琴师，指下有山河',place:'feng',ic:'🎼',pers:'文静'},
  qingwu:{name:'顾青梧',g:'f',tag:'暗阁的女刺客，笑起来很淡',place:'an',ic:'🗡',pers:'疯批'},
  baiheng:{name:'白蘅',g:'f',tag:'春楼清倌人，只唱曲不陪酒',place:'chun',ic:'🏮',pers:'花心'},
  yelan:{name:'夜阑',g:'?',tag:'夜里来的客人，从不留名',place:'home',ic:'🕯',pers:'病娇'}
};
var NPC_IDS=['shen','xiao','xuan','wanyue','qingwu','baiheng'];

/* 相亲名录：十八岁仍无良人时，长辈替你/替孩子定下 */
var MATCH_NPCS=[
  {id:'liuzhiwei',name:'柳知微',g:'m',tag:'城南书院的书生，说话极轻',place:'cha',ic:'📜',pers:'文雅'},
  {id:'yanshou',name:'严守拙',g:'m',tag:'镖局少东家，一身硬骨头',place:'wu',ic:'🛡',pers:'暴躁'},
  {id:'heqingzhou',name:'贺清舟',g:'m',tag:'药堂掌柜，温和寡言',place:'shan',ic:'🌿',pers:'闷骚'},
  {id:'shenmu',name:'沈牧',g:'m',tag:'县衙主簿，规矩人',place:'cha',ic:'🖋',pers:'地雷'},
  {id:'tangyin',name:'唐寅生',g:'m',tag:'画舫上的琴客，风流不羁',place:'feng',ic:'🎐',pers:'花心'},

/* ================= 落叶 ================= */
function spawnFx(month){
  var season=SEASON[month];
  var pool=season==='winter'?['🍃','❄','🌿']:(season==='autumn'?['🍂','🍃','🌾']:['🍃','🌿','🍀']);
  var fx=document.getElementById('fx'); fx.innerHTML='';
  for(var i=0;i<9;i++){
    var s=document.createElement('span');
    s.textContent=pk(pool);
    s.style.left=ri(0,97)+'%';
    s.style.fontSize=ri(15,30)+'px';
    s.style.animation='sway '+ri(11,22)+'s linear infinite';
    s.style.animationDelay=(ri(0,14)/1.4)+'s';
    s.style.opacity=(ri(35,85)/100);
    fx.appendChild(s);
  }
  document.body.className='s-'+season;
}

  var el=document.getElementById('toast');

    el=document.createElement('div'); el.id='toast';
    el.style.cssText='position:fixed;left:50%;top:20px;transform:translateX(-50%);'+
      'background:rgba(40,60,45,.94);color:#fff;padding:10px 22px;border-radius:10px;'+
      'z-index:60;font-size:15px;letter-spacing:1px;max-width:80%;text-align:center;';
    document.body.appendChild(el);

  clearTimeout(toastTimer);

}

/* 页面历史：点空白处返回上一级 */
var PAGE_HIST=[];
function goPage(p){
  if(!G)return;
  if(!pageAllowed(p)){toast(G.career==='palace'?'宫门不是你随意走的地方。':'');return;}
  if(p!==G.page){
    PAGE_HIST.push(G.page);
    if(PAGE_HIST.length>30)PAGE_HIST.shift();
  }
  G.page=p; render();
}
/* 命途决定能去的地方 */
function pageAllowed(p){
  if(!G)return false;
  if(!PLACES[p])return false;
  if(G.career==='palace'){
    if(G.chill)return p==='pal_cold'||p==='people';
    return p.indexOf('pal_')===0?p!=='pal_cold':p==='people';
  }
  return p.indexOf('pal_')!==0;
}
function goBack(){
  if(G&&G.page!=='home'&&PAGE_HIST.length){
    G.page=PAGE_HIST.pop(); render(); return true;
  }
  return false;
}
function drawFoot(){
  var nav=document.getElementById('nav');
  var h='';
  var keys;
  if(G.career==='palace'){
    keys=G.chill?['pal_cold','people']:['pal_quarter','pal_bureau','pal_garden','pal_medical','pal_temple','people'];

/* 五行灵根：由日常行事里慢慢醒过来 */
var ELEM_SRC={herbplot:'土',flower:'土',seed:'土',
  dao:'水',breathe:'水',sc_meditate:'水',rest:'水',
  cook:'火',dan:'火',sc_alchemy:'火',
  train:'风',dance:'风',dc_prac:'风',
  kill:'雷',jh_fight:'雷',xia_help:'雷',jh_challenge:'雷'};
function rootText(){
  if(!G)return '';
  var s=G.root||'未测';
  if(G.elem&&G.elem.length)s+='·'+G.elem.join('·');
  return s;
}
function elemChance(id){
  var e=ELEM_SRC[id];
  if(!e)return;
  if(!G.elem)G.elem=[];
  if(!G.elemTry)G.elemTry={};
  if(G.elem.indexOf(e)>=0)return;
  var t=G.elemTry[e]||0;
  var base=(e==='火'||e==='风'||e==='雷')?8:7;
  var p=Math.min(32,base+t*2);
  G.elemTry[e]=t+1;
  if(ri(1,100)<=p){
    G.elem.push(e);
    gain('ling',{土:6,水:7,火:8,风:9,雷:10}[e],240);
    addLog('🔮 你怔了一下——掌心底下，好像有什么醒了过来。<b>灵根：'+e+'</b>。','gold');
    toast('灵根觉醒：'+e);
  }else if(ri(1,100)<=10){
    var hint={土:'指尖沾了一层土，怎么也拍不掉。',
      水:'手心里凉了一瞬，像刚摸过井水。',
      火:'有东西烫了一下，你却没觉得疼。',
      风:'风从袖口穿过去，好像绕着你转了一圈。',
      雷:'耳边嗡了一声，四下忽然静了。'}[e];
    addLog('🔮 '+hint,'gd2');
  }
}
function washUse(){
  if(!G.wash){toast('没有洗髓丹。');return;}
  G.wash--;G.root=null;G.elem=[];G.elemTry={};
  var r=ri(1,100),nm,ex,li;
  if(r<=12){nm='天灵根';ex=ri(40,60);li=ri(20,30);}
  else if(r<=38){nm='双灵根';ex=ri(24,36);li=ri(12,20);}
  else if(r<=72){nm='三灵根';ex=ri(14,22);li=ri(6,12);}
  else{nm='杂灵根';ex=ri(6,12);li=ri(2,6);}
  G.root=nm;
  gain('exp',ex,300);gain('ling',li,200);
  addLog('💠 洗髓的痛过去了，你重新摸到自己的根骨：<b>'+nm+'</b>。','gold');
  openModal('洗 髓','<div class="story-panel"><div class="story-title">重 塑</div>'+
    '<div class="story-text"><p>旧根骨一寸寸化开，像水洗过石灰。</p>'+
    '<p class="hl">新的灵根：'+nm+'</p>'+
    '<p class="tiny">修为 +'+ex+'　灵力 +'+li+'　此前的五行灵根已尽数散去</p></div></div>');
  render();
}

function doAct(id){
  if(!G||G.ended)return;
  if(id!=='none' && G.sp<10){ forceSleep(); return; }
  if(id.indexOf('date_')===0){ if(!checkAct())return; dateWho(id); return; }
  if(id.indexOf('gift_')===0){ giftWho(id); return; }
  if(id.indexOf('wed_')===0){ wedWho(id); return; }
  if(id==='none')return;
  var needs=['flower','veg','herbplot','read','copy','qin','painting','yaji','gossip','intel','kill','train','listen','dance','herb','tame','breathe','dao','dan','seed','haggle','inquiry','ruin','sectjob','enterpalace','jianghu','pl_greet','pl_ally','pl_wife','pl_mianhou','jh_fight','jh_ally','jh_challenge',
    'xialine','xia_hear','xia_help','xia_swear','dancerline','dc_prac','dc_show','dc_tempt','dc_married','joinsect','sc_meditate','sc_spell','sc_alchemy','bg_hire','vow','payquiet','pl_poison','pl_scar','pl_miscarry','dk_frame','dk_silence','wash_buy','wash_use',
    'pq_dress','pq_sew','pq_letter','pq_rest','pb_duty','pb_rule','pb_ledger','pb_ally',
    'gb_patrol','gb_drill','gb_mates','gb_reward','pc_affairs','pc_court','pc_banquet','pc_memorial',
    'ab_drill','ab_patrol','ab_mates','ab_merit','cb_gift','cb_spy','cb_ally','pg_flower','pg_dew','pg_swing','pg_eaves','pm_pulse','pm_herb','pm_learn','pt_sutra','pt_incense','pt_talk','pc_bribe','pc_endure','pc_wait'];
  if(needs.indexOf(id)>=0 && !checkAct())return;
  switch(id){
    case 'flower':
      spend(8);gain('charm',ri(4,7),240);G.plots++;G.plotsDone=1;
      digUp();done('🌸 播下半畦花种，指尖沾了泥，心里却松快。');break;
    case 'veg':
      spend(8);G.food+=ri(2,4);G.money+=ri(8,16);
      digUp();done('🥬 摘了一篮青菜，换了些散碎银钱。');break;
    case 'herbplot':
      if(G.seeds<=0){toast('没有灵植种子，先去集市买');return;}
      spend(10);G.seeds--;G.lingzhi+=ri(1,2);gain('exp',ri(2,4),300);
      done('🌱 灵植破土，叶片上凝着一层薄薄的青光。');break;
    case 'cook':
      G.hp=cl(G.hp+ri(6,11),0,100);G.sp=cl(G.sp+ri(6,10),0,100);
      done('🍲 一灶烟火起，饭菜香漫过整个院子。');break;
    case 'rest':
      G.sp=cl(G.sp+18,0,100);
      done('🍵 檐下坐了一会儿，听风过槐叶。');break;
    case 'adopt':
      G.money-=400;
      var cn=pk(['阿棠','小满','砚生','青禾','知乐','念安','小簟','阿糯']);
      G.children.push({name:cn,age:ri(4,9)});
      done('🧸 你牵回了一个孩子，从此院里多了一声唤你。');break;
    case 'pet':
      G.money-=120;
      var pn=pk(['团子','雪球','阿橘','墨团','阿灰']);
      G.pets.push({name:pn,kind:pk(['猫','狗','兔','小狐']),full:100,mood:75});
      done('🐾 一只'+G.pets[G.pets.length-1].kind+'蜷进你怀里，赖着不走了。');break;
    case 'feedpet':
      if(!G.pets.length){toast('院里没有灵宠。');return;}
      var pf=null;
      for(var pi=0;pi<G.pets.length;pi++){
        if(!pf||(G.pets[pi].full||0)<(pf.full||0))pf=G.pets[pi];
      }
      pf.full=pf.full||0;
      if(pf.full>=95){toast(pf.name+'还不饿，晚些再喂。');return;}
      if(G.pill>0){
        G.pill--;pf.full=Math.min(100,pf.full+40);
        done('🍖 你碾碎一枚丹药喂给'+pf.name+'，它含在嘴里，眼睛一下亮了。');
      }else if(G.lingzhi>0){
        G.lingzhi--;pf.full=Math.min(100,pf.full+28);
        done('🌱 你掰了半株灵植喂'+pf.name+'，它吃得连叶脉都不剩。');
      }else{
        toast('没有丹药也没有灵植，先去炼丹或采药');return;
      }break;
    case 'playpet':
      if(!G.pets.length){toast('院里没有灵宠。');return;}
      if(G.sp<10){toast('实在没力气了，先歇一歇。');return;}
      var pp=pk(G.pets);
      if(pp.mood===undefined)pp.mood=70;
      spend(10);
      pp.mood=cl(pp.mood+ri(10,18),0,100);
      pp.full=cl((pp.full===undefined?100:pp.full)-3,0,100);
      for(var _pi=0;_pi<G.pets.length;_pi++){
        var _op=G.pets[_pi];
        if(_op===pp)continue;
        if(_op.mood===undefined)_op.mood=70;
        _op.mood=cl(_op.mood+ri(3,6),0,100);
      }
      var pMsg=pp.mood>=70?'尾巴摇得像要飞起来':'终于肯抬头看你了';
      done('🎾 你拿草茎逗'+pp.name+'，它追着光斑跑了满院，'+pMsg+'。');break;
    case 'namepet':
      openPetName();return;
    case 'read':
      spend(9);gain('learn',ri(6,10),240);gain('exp',ri(2,4),300);
      done('📖 读到日落，书页边被你翻得卷了角。');break;
    case 'copy':
      spend(10);G.money+=ri(22,40);gain('learn',ri(3,5),240);
      done('✍ 抄了半日书，腕子酸，袋子鼓了些。');break;
    case 'wen':
      spend(12);gain('learn',ri(6,10),240);gain('charm',ri(4,8),240);G.money+=ri(30,60);
      done('🎋 文会上你一句压了满座，有人悄悄记了你的名字。');break;
    case 'qin':
      spend(9);gain('art',ri(5,9),240);gain('charm',ri(3,6),240);
      done('🎼 一曲终了，苏挽月在你身侧轻轻点头。');break;
    case 'painting':
      spend(9);gain('art',ri(6,10),240);
      done('🖌 落笔成一支晚荷，纸还湿着。');break;
    case 'yaji':
      spend(12);gain('charm',ri(5,9),240);G.money+=ri(10,30);tryMeet('feng');
      done('🍶 雅集上觥筹交错，你被人多看了几眼。');break;
    case 'gossip':
      spend(7);gain('learn',ri(2,5),240);tryMeet('cha');
      done('👂 茶楼里听了一耳朵的江湖事。');break;
    case 'tea':
      G.sp=cl(G.sp+8,0,100);
      done('🍵 一盏雨前茶，苦后回甘。');break;
    case 'intel':
      spend(11);G.money+=ri(60,110);gain('sword',ri(3,6),240);gain('learn',ri(2,4),240);tryMeet('an');
      done('🕵 一份密信换了银子，也换来一次对视。');break;
    case 'kill':
      spend(18);G.money+=ri(150,300);gain('sword',ri(6,11),240);
      var dmg=ri(6,18);G.hp=cl(G.hp-dmg,1,999);
      if(G.hp<=1)addLog('🩸 这一趟险些回不来，血浸了半幅袖子。','bd');

/* ================= 黑化值 ================= */
function npcDark(id){return (G.ndark&&G.ndark[id])||0;}
function npcDarkMult(id){
  var p=(NPCS[id]&&NPCS[id].pers)||'';
  return /病娇|疯批|狂气|地雷|暴躁/.test(p)?2:1;
}
function addNpcDark(id,v){
  if(!G.ndark)G.ndark={};
  if(!G.flags)G.flags={};
  if(!NPCS[id]||NPCS[id].nr)return;
  G.ndark[id]=cl((G.ndark[id]||0)+v,0,100);
  if(G.ndark[id]>=100){
    if(!G.flags.npcDarkPending){
      G.flags.npcDarkPending=id;
      addLog('🖤 '+NPCS[id].name+'的眼神彻底沉了下去。','bd');
    }
  }else if(G.flags.npcDarkPending===id){
    delete G.flags.npcDarkPending;
  }
}
function darkestNpc(){
  if(!G.ndark)return null;
  var best=null,bv=54;
  for(var id in G.ndark){
    if(!G.met[id]||!NPCS[id]||NPCS[id].nr||NPCS[id].follow)continue;
    if(G.ndark[id]>bv){bv=G.ndark[id];best=id;}
  }
  return best;
}
function npcDarkEnd(id){
  if(G.ended)return;
  G.flags.npcDark=id;
  endGame();
}
function evNpcDark(id){
  if(!id||!NPCS[id])return;
  var n=NPCS[id],he=n.g==='m'?'他':(n.g==='f'?'她':'他');
  openModal('🖤 '+n.name,'<div class="story-text">'+
    '<p>'+n.name+'站在门外，不知道站了多久。'+he+'手里攥着一样东西，攥得指节发白。</p>'+
    '<p class="secret">「你身边人太多了。」'+he+'说，「我不喜欢。」</p>'+
    '<p class="tiny">黑化 '+npcDark(id)+' / 100</p></div>'+

function peopleActs(){
  var out=[];
  var ids=Object.keys(NPCS);
  for(var i=0;i<ids.length;i++){
    var id=ids[i], n=NPCS[id];
    if(!G.met[id])continue;
    if(n.follow){
      out.push({id:'none',ic:n.ic,t1:n.name+'（随从）',t2:n.tag,t3:'已收编'});
      continue;
    }
    var f=(G.npcs[id]||0);
    if(n.nr){
      out.push({id:'none',ic:n.ic,t1:n.name,t2:n.tag,t3:'宫中长辈，只可敬着'});
      continue;
    }
    var mine=(G.married===id)||((G.wives||[]).indexOf(id)>=0);
    var st=mine?'已结为夫妻':(f>=100?'情定':(f>=60?'心意已通':(f>=25?'可约':'尚浅')));
    var dk=npcDark(id);
    out.push({id:'date_'+id,ic:n.ic,t1:(dk>=70?'⚠ ':'')+'邀约 '+n.name,
      t2:n.tag+'　性格 '+(n.pers||'难测')+'　好感 '+f+'/100'+(dk>0?'　黑化 '+dk+'/100':''),t3:st});
    out.push({id:'gift_'+id,ic:'🎁',t1:'赠礼 '+n.name,t2:'银两-60，好感+9',t3:'银两-60'});
    var canWed=(f>=100&&!mine&&(G.sex==='m'?(G.wives||[]).length<4:!G.married));
    if(canWed){
      out.push({id:'wed_'+id,ic:'🏮',t1:(G.sex==='m'?'娶 '+n.name+' 为妻':'与 '+n.name+' 成婚'),
        t2:'红烛高张，从此两姓一家',t3:'银两-800',
        cond:function(){return G.money>=800;}});
    }
  }
  if(!out.length)out.push({id:'none',ic:'🌫',t1:'尚无相识之人',t2:'去茶楼、风雅楼等处走走，或许会遇见谁',t3:''});
  return out;
}

  G.money-=800;
  if(male)G.wives.push(id); else G.married=id;

var _cands=[];
function forceMatch(){
  if(!G||G.ended)return;

  if(G.lovers.length>0)return;
  if(G.flags&&G.flags.pending)return;
  if(G.vow){
    if(G.vowPaid)return;
    if(G.money>=10000){
      G.money-=10000;G.vowPaid=true;
      addLog('💰 你把一万两推过去，族老数了三遍，把庚帖收回了袖子。','gold');
      toast('万金买了个清静');
      render();return;
    }
    addLog('🏮 族老又来了：「不嫁不娶，老了谁管你？」你把话咽了回去。','pink');
    toast('长辈又在催婚');
    render();return;
  }
  var want=G.sex==='m'?'f':'m';
  var pool=MATCH_NPCS.filter(function(x){return x.g===want;});
  pool=pool.slice().sort(function(){return Math.random()-0.5;});
  _cands=pool.slice(0,3);
  G.flags.pending=true;
  var child=G.sex==='m'?'他':'她';
  var intro;
  if(G.mode==='self'){
    intro='十八岁了，仍没个着落。族中长辈堵在门口，媒人把庚帖拍在桌上——这桩亲事，由不得你再拖。';
  }else{
    intro='孩子十八了，仍无人家。你以'+(G.mode==='mom'?'母亲':'父亲')+'的身份，替'+child+'应下了这桩亲事。此后山高水远，便是'+child+'自己的路了。';
  }
  var h='<div class="story-text"><p>'+intro+'</p>'+
    '<p class="tiny">可从中择一人，也可一力推却——只是长辈不会就此罢休。若日后攒够万金，方能买个清静。</p></div>';
  for(var i=0;i<_cands.length;i++){
    var c=_cands[i];
    h+='<button class="buy" style="width:100%;text-align:left;margin-top:8px" onclick="acceptMatch('+i+')">'+
       c.ic+'　<b>'+c.name+'</b>　'+c.tag+'</button>';

function refuseMatch(){
  G.flags.pending=false;_cands=[];
  closeModal();

  toast('长辈不会就此罢休');

function acceptMatch(i){
  var c=_cands[i];

  if(G.lovers.indexOf(id)<0)G.lovers.push(id);

/* ================= 秘境探幽：一层层往下，见好就收 ================= */
var _ruin=null;
function startRuin(){
  _ruin={d:0,money:0,herb:0,exp:0,ling:0,treasure:[],hurt:0};
  ruinLayer();
}
function ruinLayer(){
  if(!_ruin)return;
  var cost=4+(_ruin.d+1)*2;
  if(G.hp<=12){ ruinStop('气血见底，再走下去要出事。'); return; }
  if(G.sp<cost){ ruinStop('精力见底，你扶着石壁退了出来。'); return; }
  _ruin.d++;
  var d=_ruin.d, r=ri(1,100), msg='', gained='';
  if(r<=10+Math.min(25,d*4)){
    var s=45+d*16, pw=battlePower();
    if(pw<s){
      var dmg=ri(4,9)+d*2;
      G.hp=cl(G.hp-dmg,1,100); _ruin.hurt+=dmg;
      msg='岩缝里蹿出一头石甲兽，你侧身避过，肩头仍被划开一道口子。';
      gained='气血 -'+dmg;
    }else{
      var ex=6+d*2; _ruin.exp+=ex;
      msg='一头石甲兽扑来，被你按在石壁上，散成一地碎石。';
      gained='修为 +'+ex;
    }
  }else if(r<=32){
    var t=pk(TREASURE_POOL); _ruin.treasure.push(t);
    msg='洞壁上嵌着一'+t.n+'，你抠下来，指腹被划了一道。';
    gained='宝物 '+t.n;
  }else if(r<=52){
    var m=ri(20,45)+d*14; _ruin.money+=m;
    msg='石缝里积着一层碎灵石，你一把一把收进袋里。';
    gained='银两 +'+m;
  }else if(r<=72){
    var hb=ri(2,4)+d; _ruin.herb+=hb;
    msg='阴湿处生着一丛药草，你连根拔起，泥还滴着水。';
    gained='草药 +'+hb;
  }else if(r<=88){
    var ex2=ri(6,11)+d*2, li=ri(3,7)+d;
    _ruin.exp+=ex2; _ruin.ling+=li;
    msg='此处灵气比外头稠，你盘膝坐了一阵，耳里嗡嗡作响。';
    gained='修为 +'+ex2+'　灵力 +'+li;
  }else{
    msg='这一层什么也没有，只有水声从更深处传上来。';
    gained='空手';
  }
  G.sp=cl(G.sp-cost,0,100);
  var loot='银两 '+_ruin.money+'　草药 '+_ruin.herb+'　修为 '+_ruin.exp+'　灵力 '+_ruin.ling+'　宝物 '+_ruin.treasure.length+' 件';
  var next=4+(d+1)*2;
  var h='<div class="story-text">'+
    '<p class="hl">第 '+d+' 层</p>'+
    '<p>'+msg+'</p>'+
    '<p class="tiny">'+gained+'　精力 -'+cost+'</p>'+
    '<p class="tiny">已得：'+loot+'</p>'+
    '<p class="tiny">你的战力 '+battlePower()+(petBonus()?'（灵宠助战 +'+petBonus()+'）':'')+'</p></div>'+
    '<div class="pair-row"><button class="buy primary" onclick="ruinLayer()">再深一层（精力 -'+next+'）</button>'+
    '<button class="buy" onclick="ruinStop()">见好就收</button></div>';
  openModal('秘 境 · 探 幽',h);
  render();
}
function ruinStop(why){
  if(!_ruin)return;
  G.money+=_ruin.money; G.herb+=_ruin.herb;
  gain('exp',_ruin.exp,300); gain('ling',_ruin.ling,200);
  for(var i=0;i<_ruin.treasure.length;i++)G.treasure.push(_ruin.treasure[i]);
  var loot='银两 '+_ruin.money+'、草药 '+_ruin.herb+'、修为 '+_ruin.exp+'、灵力 '+_ruin.ling+'、宝物 '+_ruin.treasure.length+' 件';
  if(_ruin.d===0){
    addLog('🕳 你在洞口站了一会儿，终究没有下去。','');
  }else{
    addLog('🕳 你从秘境退回地面，带出'+loot+'。','gold');
    if(_ruin.hurt)addLog('🩸 这一趟伤得不轻，气血亏了'+_ruin.hurt+'。','bd');
    G.actionsToday++;
  }
  _ruin=null;
  closeModal();
  if(why)toast(why);
  render();
  if(G.sp<10)setTimeout(forceSleep,600);
}

  if(G.flags.queen||G.flags.taihou||G.chill)return false;

/* ================= 时间 ================= */
function advanceDay(){ advance(1); }
function advanceMonth(){ advance(ri(26,30)); }
function advanceYear(){ advance(360); }
function advance(n){
  if(!G||G.ended)return;
  for(var i=0;i<n;i++){
    G.day++; G.totalDays++;
    G.sp=cl(G.sp+2,0,100);
    if(i%10===0){G.hp=cl(G.hp+1,0,100);}
    if(G.day>30){G.day=1;G.month++;}
    if(G.month>12){G.month=1;G.year++;G.age++;
      if(G.age>=18&&G.lovers.length===0&&G.flags.matchYear!==G.age){
        G.flags.matchYear=G.age;
        setTimeout(forceMatch,600);
      }
    }
    if(G.age>=30){endGame();return;}
  }
  for(var _pk=G.pets.length-1;_pk>=0;_pk--){
    var pt=G.pets[_pk];
    if(pt.mood===undefined)pt.mood=70;
    pt.full=Math.max(0,(pt.full===undefined?100:pt.full)-n);
    if(pt.full<=0){
      pt.starve=(pt.starve||0)+n;
      if(pt.starve>=12){
        addLog('🐾 '+pt.name+'饿得皮包骨，某天清晨自己走了，门口留下一串脚印。','bd');
        G.pets.splice(_pk,1);continue;
      }
    }else pt.starve=0;
    if(pt.full>0&&pt.full<=25){addLog('🐾 '+pt.name+'饿得直叫，蹭着你的腿。记得喂它。','bd');}
    /* 心情值逐日下滑，饿着滑得更快 */
    pt.mood=cl(pt.mood-n*(pt.full<=25?2:1),0,100);
    if(pt.mood<=25){
      addLog('🐾 '+pt.name+'缩在墙角，一整天不声不响，'+({猫:'连尾巴都不肯摇',狗:'连骨头都不看一眼',兔:'耳朵一直耷着',小狐:'眼里没了光',灵兽:'伏着不动'}[pt.kind]||'没什么精神')+'。','bd');
      /* 抑郁到极点，有概率离家出走 */
      if(ri(1,100)<=(pt.mood<=8?12:4)*n){
        addLog('🐾 天亮时院门开着，'+pt.name+'不见了。你在巷口找了三天，只捡到它常趴的那块石头。','bd');
        G.pets.splice(_pk,1);
      }
    }
  }
  G.actionsToday=0; G.plotsDone=0;
  spawnFx(G.month);
  addLog('⏳ 又过了'+n+'日，'+seasonLine(),'gd2');
  render();
  maybeConflict();
  maybeStoryEvent();
  maybeCareerEvent();
}

var _rvA=null,_rvB=null,_sdN=null;
function maybeStoryEvent(){
  if(!G||G.ended)return;
  if(G.flags.npcDarkPending){npcDarkEnd(G.flags.npcDarkPending);return;}
  if(G.flags.pending)return;
  if(document.getElementById('overlay').classList.contains('show'))return;
  if(G.totalDays-(G.flags.stCd||-999)<10)return;
  if(ri(1,100)>55)return;
  G.flags.stCd=G.totalDays;
  var pool=[];
  if(spouseIds().length)pool.push('nbr','nbr','inlaw','poach');
  if(G.lovers.length>=2)pool.push('rv','rv');
  if(G.root&&G.age>=14)pool.push('sect','sect');
  if(G.pets.length)pool.push('petsick');
  var _dk=darkestNpc(); if(_dk)pool.push('ndark','ndark');
  pool.push('lost');
  pool.push('sud','sud');
  var k=pk(pool);
  if(k==='nbr')evNeighbor();
  else if(k==='inlaw')evInlaw();
  else if(k==='rv')evRival();
  else if(k==='sect')evSect();
  else if(k==='petsick')evPetSick();
  else if(k==='lost')evLost();
  else if(k==='poach')evPoach();
  else if(k==='ndark')evNpcDark(_dk);
  else evSudden();
}

function maybeCareerEvent(){
  if(!G||G.ended)return;
  if(!G.career||G.career==='folk'||G.career==='exile')return;
  if(G.flags.pending)return;
  if(document.getElementById('overlay').classList.contains('show'))return;
  if(G.totalDays-(G.flags.carCd||-999)<18)return;
  if(ri(1,100)>42)return;
  G.flags.carCd=G.totalDays;
  if(G.dark>=60&&ri(1,100)<=25){darkEvent();return;}
  if(G.career==='palace'&&!G.chill&&G.role==='concubine'&&G.cStage>=2&&ri(1,100)<=30){palaceHarmed();return;}
  if(G.career==='palace')palaceEvent();
  else if(G.career==='martial')jhEvent();
  else if(G.career==='xia')xiaEvent();
  else if(G.career==='dancer')dancerEvent();
  else if(G.career==='sect')sectEvent();
}

}

    closeModal();toast('慢慢调过来了');
  }else{
    _sickPet.full=cl((_sickPet.full||0)-10,1,100);
    addLog('🌱 灵植只压住了一半，'+_sickPet.name+'还是没精神。','');

function evPetWait(){
  if(!_sickPet){closeModal();return;}
  var p=_sickPet;
  var weak=(p.full||0)<20||(p.starve||0)>=2;
  if(ri(1,100)<=40){
    p.full=100; p.starve=0;
    addLog('🐾 天快亮时，'+p.name+'自己爬起来喝了水。','gd2');
    closeModal();toast('它自己撑过来了');
  }else if(ri(1,100)<=(weak?ri(25,35):15)){
    var idx=G.pets.indexOf(p);
    if(idx>=0)G.pets.splice(idx,1);
    _sickPet=null;
    G.charm=cl(G.charm-2,0,240);
    addLog('🐾 天亮了，'+p.name+'一直没有醒。你在院后的老树下挖了个浅坑，把土盖严实了。','bd');
    closeModal();toast('它没能撑过来');

function evLostHire(){

  closeModal();toast('孩子平安回来了');render();
}
function evLostIgnore(){
  G.charm=cl(G.charm-3,0,240);

function seasonLine(){  var m=G.month;
  if(m===1)return '腊梅压雪，岁首宜守。';
  if(m===2)return '河冰渐解，柳眼初开。';
  if(m===3)return '桃花压枝，燕子在檐下衔泥。';
  if(m===4)return '谷雨初霁，麦苗正抽穗。';
  if(m===5)return '榴花照眼，风里有枇杷的甜。';
  if(m===6)return '荷花半开，蝉声起得早。';
  if(m===7)return '萤火满塘，夜里也热。';
  if(m===8)return '桂子初飘，暑气将尽。';
  if(m===9)return '菊黄蟹肥，天高云淡。';
  if(m===10)return '霜降过后，柿子红透了。';
  if(m===11)return '北风卷地，白草折尽。';
  return '雪压断桥，炉火正温。';
}

function attrTop(){
  var a=[
    {k:'learn',v:G.learn,tag:'以文立身'},
    {k:'sword',v:G.sword,tag:'以武立身'},
    {k:'art',v:G.art,tag:'以艺立身'},
    {k:'charm',v:G.charm,tag:'风华为名'},
    {k:'exp',v:Math.floor(G.exp*0.8),tag:'以道立身'}
  ];
  a.sort(function(x,y){return y.v-x.v;});
  return a[0];
}

  }

  }
  var html='<div class="story-panel"><div class="story-title">结局 · '+tags.join(' · ')+'</div>'+

    '<p>'+main+'</p>'+extra+

    '</div></div>'+

/* ================= 存档 ================= */
var SAVE_KEY='xxhy_save_v1';
var IDB_NAME='xxhy_db', IDB_STORE='save';
var _saveTimer=null;

/* 备档：IndexedDB，防 localStorage 单点写坏 */
function idbOpen(cb){
  try{
    if(!window.indexedDB)return cb(null);
    var rq=indexedDB.open(IDB_NAME,1);
    rq.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);
    };
    rq.onsuccess=function(e){cb(e.target.result);};
    rq.onerror=function(){cb(null);};
  }catch(e){cb(null);}
}
function idbPut(raw){
  idbOpen(function(db){
    if(!db)return;
    try{
      var tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put({raw:raw,at:Date.now()},'main');
      tx.oncomplete=function(){try{db.close();}catch(e){}};
    }catch(e){}
  });
}
function idbGet(cb){
  idbOpen(function(db){
    if(!db)return cb(null);
    try{
      var tx=db.transaction(IDB_STORE,'readonly');
      var rq=tx.objectStore(IDB_STORE).get('main');
      rq.onsuccess=function(){cb(rq.result&&rq.result.raw?rq.result.raw:null);};
      rq.onerror=function(){cb(null);};
    }catch(e){cb(null);}
  });
}
function writeSave(silent){
  if(!G||G.ended)return false;
  var raw;
  try{G.savedAt=Date.now();raw=JSON.stringify({G:G});}catch(e){return false;}
  var ok=false;
  try{localStorage.setItem(SAVE_KEY,raw);ok=true;}catch(e){}
  idbPut(raw);
  if(!silent){
    if(ok)toast('已存档');
    else toast('本地存储不可用，已写入备档');
  }
  return ok;
}
function save(){ if(!G){toast('还没有开始这一生');return;} writeSave(false); }
function autoSave(){
  if(!G||G.ended)return;
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(function(){writeSave(true);},400);
}
/* 重开：保留旧档，回到开局界面 */
function askRestart(){
  openModal('重 开','<div class="story-text"><p>要重开这一生吗？</p>'+
    '<p class="tiny">当前进度已自动保存，重开后仍可从开局界面「继续上一世」回到此刻。</p></div>'+
    '<div class="pair-row"><button class="buy" onclick="closeModal()">继续这一生</button>'+
    '<button class="buy primary" onclick="doRestart()">重 开</button></div>');
}
function doRestart(){
  closeModal();
  try{
    if(G&&!G.ended){
      G.savedAt=Date.now();
      var _raw=JSON.stringify({G:G});
      localStorage.setItem(SAVE_KEY,_raw);
      idbPut(_raw);
    }
  }catch(e){}
  G=null; PAGE_HIST=[];
  document.getElementById('wrap').style.display='none';
  document.getElementById('boot').style.display='flex';
  bootScreen();
}
/* 把存档文本还原成游戏状态 */
function applySave(raw){
  var data=JSON.parse(raw);
  G=data.G;
  if(!G||typeof G!=='object')throw new Error('bad save');
  G.ended=false;
  if(!G.sex)G.sex='f';
  if(!G.flags)G.flags={matchYear:0};
  if(G.flags.death)delete G.flags.death;
  if(G.flags.evCd===undefined)G.flags.evCd=-99;
  if(!G.treasure)G.treasure=[];
  if(!G.pets)G.pets=[];
  if(!G.children)G.children=[];
  if(!G.lovers)G.lovers=[];
  if(!G.log)G.log=[];
  if(G.seeds===undefined)G.seeds=1;
  if(G.lingzhi===undefined)G.lingzhi=0;
  if(G.root===undefined)G.root=null;
  if(G.followers===undefined)G.followers=0;
  if(G.married===undefined)G.married=null;
  if(G.egg&&G.mode!=='self')G.egg=false;
  if(!G.wives)G.wives=[];
  if(!G.mianshou)G.mianshou=[];
  if(!G.acc)G.acc=[];
  if(!G.ndark)G.ndark={};
  if(G.robFail===undefined)G.robFail=0;
  if(G.pill===undefined)G.pill=0;
  if(!G.career)G.career='folk';
  if(G.cStage===undefined)G.cStage=0;
  if(G.clout===undefined)G.clout=0;
  if(G.chill===undefined)G.chill=false;
  if(G.role===undefined)G.role='';
  if(G.dark===undefined)G.dark=0;
  if(G.vow===undefined)G.vow=false;
  if(G.vowPaid===undefined)G.vowPaid=false;
  if(G.guard===undefined)G.guard=0;
  if(!G.elem)G.elem=[];
  if(!G.elemTry)G.elemTry={};
  if(G.wash===undefined)G.wash=0;
  for(var _pi=0;_pi<G.pets.length;_pi++){if(G.pets[_pi].full===undefined)G.pets[_pi].full=100;if(G.pets[_pi].mood===undefined)G.pets[_pi].mood=70;}
  if(G.flags.stCd===undefined)G.flags.stCd=-999;
  PAGE_HIST=[];
  document.getElementById('orb').style.display='flex';
  document.getElementById('bootleaves').className='bootleaves ingame';
  spawnBootLeaves(7);
  document.getElementById('boot').style.display='none';
  document.getElementById('wrap').style.display='flex';
  spawnFx(G.month); render();
  return true;
}
function loadGame(){
  var raw=null;
  try{raw=localStorage.getItem(SAVE_KEY);}catch(e){}
  if(!raw)return rescueFromIdb();
  try{return applySave(raw);}
  catch(e){return rescueFromIdb();}
}
function rescueFromIdb(){
  toast('本地存档不可用，正在从备档恢复…');
  idbGet(function(raw){
    if(!raw){toast('读档失败：没有可用存档');return;}
    try{applySave(raw);toast('已从备档恢复');}
    catch(e){toast('备档也损坏了，只能开新档');}
  });
  return false;
}
/* 导出 / 导入：一段文本，可存到别处 */
function exportSave(){
  if(!G){toast('还没有可导出的存档');return;}
  try{
    G.savedAt=Date.now();
    var raw=JSON.stringify({G:G});
    var txt='XHY-SAVE-1:'+btoa(unescape(encodeURIComponent(raw)));
    var a=document.createElement('a');
    a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);
    a.download='修仙还是游戏人间-存档-'+new Date().toISOString().slice(0,10)+'.txt';
    document.body.appendChild(a);a.click();a.remove();
    toast('已导出存档，请收好文件');
  }catch(e){toast('导出失败');}
}
function openImport(){
  openModal('导 入 存 档','<div class="story-text"><p>把之前「导出」得到的整段文本粘进来，就能回到那一生。</p></div>'+
    '<textarea id="impTxt" class="qty-input" style="height:120px;width:100%;resize:vertical" placeholder="XHY-SAVE-1:..."></textarea>'+
    '<button class="buy primary" style="width:100%;padding:12px;margin-top:12px" onclick="doImport()">导 入</button>');
}
function doImport(){
  var el=document.getElementById('impTxt');
  var t=(el?el.value:'').trim();
  if(!t){toast('内容为空');return;}
  t=t.replace(/^XHY-SAVE-1:/,'').replace(/\s+/g,'');
  var raw=null;
  try{raw=decodeURIComponent(escape(atob(t)));}catch(e){toast('这段文本不是有效的存档');return;}
  try{
    closeModal();
    applySave(raw);
    try{localStorage.setItem(SAVE_KEY,raw);}catch(e){}
    idbPut(raw);
    toast('导入成功，已回到那一生');
  }catch(e){toast('存档内容不完整，导入失败');}
}

/* ================= 开局 ================= */
function spawnBootLeaves(n){
  var box=document.getElementById('bootleaves');
  if(!box)return;
  var cols=[['#e4f2d6','#96c58c'],['#d6eabc','#84b87e'],['#cde2a6','#a3c67f'],['#dff0cd','#9cca93'],['#e8f3d2','#a9ce9a']];
  var h='';
  n=n||18;
  for(var i=0;i<n;i++){
    var c=cols[i%cols.length];
    var w=ri(9,16), len=Math.round(w*ri(38,50)/10);
    var blur=(i%4===0)?1:0;
    h+='<span style="left:'+ri(0,99)+'%;width:'+w+'px;height:'+len+'px;'+
      'background:linear-gradient(135deg,'+c[0]+','+c[1]+');'+
      'opacity:'+(ri(45,88)/100)+';filter:blur('+blur+'px);'+
      'animation:leafFall '+ri(13,26)+'s linear '+(0-ri(0,26))+'s infinite;"></span>';
  }
  box.innerHTML=h;
}
function bootScreen(){
  var b=document.getElementById('boot');
  var has=false, gapDays=0;
  try{
    var _raw=localStorage.getItem(SAVE_KEY);
    has=!!_raw;
    if(has){
      try{
        var _sv=JSON.parse(_raw);
        if(_sv&&_sv.G&&_sv.G.savedAt)gapDays=Math.floor((Date.now()-_sv.G.savedAt)/86400000);
      }catch(e){gapDays=999;}
    }
  }catch(e){}
  document.getElementById('bootleaves').className='bootleaves bootbg';
  spawnBootLeaves();
  var h='<div class="boot-card">';
  h+='<div class="logo">修仙还是游戏人间</div>';
  h+='<div class="sub">一 念 入 世 · 一 念 出 世</div>';
  h+='<div class="desc">十岁那年，你站在半亩小院里，<br>'+
     '前头是一整座人间的热闹，<br>身后是一条清冷的山道。<br><br>'+
     '你要以何种身份，走这一遭？</div>';
  h+='<div class="btn-row">';
  h+='<button class="btn-primary" onclick="chooseMode('+"'mom'"+')">做 母 亲</button>';
  h+='<button class="btn-primary" onclick="chooseMode('+"'dad'"+')">做 父 亲</button>';
  h+='<button class="btn-ghost" onclick="chooseMode('+"'self'"+')">我亲自入世</button>';
  h+='</div>';
  if(has){
    h+='<div style="margin-top:16px"><button class="buy" onclick="loadGame()">继续上一世</button></div>';
    if(gapDays>=7)
      h+='<div class="hint" style="margin-top:10px">⚠ 距上次存档已 '+gapDays+' 天。浏览器或清理工具可能随时抹掉本地记录——请先导出存档，再继续。</div>';
    else
      h+='<div class="hint" style="margin-top:10px">存档只在这台设备的浏览器里。长期不回来可能被清理，建议每隔一阵导出一次。</div>';
  }else{
    h+='<div style="margin-top:16px"><button class="buy" onclick="rescueFromIdb()">🔁 从备档恢复</button></div>';
    h+='<div class="hint" style="margin-top:10px">没有找到本地存档。若之前导出过，可点下方「导入存档」找回。</div>';
  }
  h+='<div style="margin-top:10px"><button class="buy" onclick="openImport()">📥 导入存档</button>'+
     (has?'<button class="buy" onclick="exportSave()">📤 导出存档</button>':'')+'</div>';
  h+='</div>';
  b.innerHTML=h;
}
function chooseMode(mode){
  var intro;
  if(mode==='mom')intro='你决定以<b class="hl">母亲</b>的身份，养大这个孩子，看她长大、成人、远行。';
  else if(mode==='dad')intro='你决定以<b class="hl">父亲</b>的身份，养大这个孩子，看她长大、成人、远行。';
  else intro='你决定<b class="hl">亲自入世</b>，以自己的脚，走这一整段人生。';
  var sexLabel=mode==='self'?'你的性别':'孩子的性别';
  var html='<div class="story-text"><p>'+intro+'</p>'+
    '<p>请取名，并定下起始年纪。</p></div>'+
    '<input type="text" id="nameIn" class="qty-input" maxlength="6" value="苏晏宁">'+
    '<div class="tiny" style="margin-top:12px">'+sexLabel+'：</div>'+
    '<select id="sexIn" class="qty-input"><option value="f">女</option><option value="m">男</option></select>'+
    '<div class="tiny" style="margin-top:10px">起始年龄（10 - 30）：</div>'+
    '<input type="number" id="ageIn" class="qty-input" min="10" max="30" value="10">'+
    '<div class="tiny" style="margin-top:6px">提示：十岁起，日子很长；也有人偏爱从别处开始。</div>'+
    '<button class="buy primary" style="width:100%;padding:13px;margin-top:12px" onclick="startRun('+"'"+mode+"'"+')">开 始 此 生</button>';
  openModal('入 世',html);
}
function startRun(mode){
  var nm=(document.getElementById('nameIn').value||'').trim();
  if(!nm){toast('请先取名');return;}
  if(nm.length>6)nm=nm.substring(0,6);
  var sexEl=document.getElementById('sexIn');
  var sex=sexEl?sexEl.value:'f';
  var age=parseInt(document.getElementById('ageIn').value,10);
  if(isNaN(age)||age<10||age>30){toast('年龄请填 10 到 30');return;}
  var egg=(age===20&&mode==='self');
  closeModal();
  document.getElementById('boot').style.display='none';
  document.getElementById('bootleaves').className='bootleaves ingame';
  spawnBootLeaves(7);
  document.getElementById('wrap').style.display='flex';
  document.getElementById('orb').style.display='flex';
  newGame(mode,nm,age,egg,sex);
  render();
  if(egg){
    setTimeout(function(){
      var t='<div class="story-text">';
      t+='<p>你从二十岁这年开始。</p>';
      t+='<p>抽屉里的信还在，火漆未拆。</p>';
      t+='<p class="secret">信封背面有一行小字：<br>「夜里有客，见灯莫慌。」</p>';
      t+='<p class="tiny">这是只在「亲自入世」且二十岁开局时出现的彩蛋。小院里会多出一件可以做的事；父母视角不会出现。</p>';
      t+='</div>';
      openModal('🕯 彩 蛋','<div class="story-panel"><div class="story-title">二十岁 · 灯下有人</div>'+t+'</div>');
    },420);
  }else if(age>=18){
    setTimeout(forceMatch,700);
  }
}

/* ================= 启动 ================= */
bootScreen();
window.addEventListener('beforeunload',function(){try{if(G&&!G.ended)save();}catch(e){}});
